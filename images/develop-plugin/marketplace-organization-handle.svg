<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Use the first part of a Marketplace Plugin ID as the organization unique handle</title>
  <desc id="description">The first part of a Marketplace Plugin ID is entered in the Unique handle field when creating an organization.</desc>
  <rect width="1200" height="360" rx="28" fill="#F5F7FB"/>

  <rect x="48" y="42" width="440" height="276" rx="20" fill="#FFFFFF" stroke="#D9DEE8" stroke-width="2"/>
  <text x="80" y="88" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">MARKETPLACE DETAILS</text>
  <rect x="80" y="120" width="64" height="64" rx="14" fill="#EEF2FF"/>
  <path d="M102 142h20v20h-20z" fill="#4C6FFF" opacity="0.22"/>
  <path d="M109 135h20v20h-20z" fill="#4C6FFF"/>
  <text x="164" y="151" fill="#101828" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Example plugin</text>
  <text x="164" y="182" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="19">A published Marketplace plugin</text>
  <text x="80" y="224" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">PLUGIN ID</text>
  <rect x="80" y="238" width="302" height="48" rx="10" fill="#E8EEFF"/>
  <text x="98" y="270" fill="#3157D5" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">team-name</text>
  <text x="225" y="270" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="22">/plugin-name</text>

  <path d="M526 180h122" stroke="#4C6FFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M633 164l18 16-18 16" fill="none" stroke="#4C6FFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="535" y="145" fill="#3157D5" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">USE THIS VALUE</text>

  <rect x="692" y="42" width="460" height="276" rx="20" fill="#FFFFFF" stroke="#D9DEE8" stroke-width="2"/>
  <text x="724" y="88" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">CREATE ORGANIZATION</text>
  <text x="724" y="148" fill="#344054" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Unique handle</text>
  <rect x="724" y="166" width="396" height="64" rx="12" fill="#FFFFFF" stroke="#4C6FFF" stroke-width="3"/>
  <text x="748" y="207" fill="#101828" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600">team-name</text>
  <text x="724" y="270" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="18">Enter the part before “/” from the Plugin ID.</text>
</svg>
